<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOT Report</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      max-width: 720px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0 16px;
      box-sizing: border-box;
    }

    button {
      padding: 10px 16px;
      cursor: pointer;
    }

    .hint {
      color: #555;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <h1>Report URL to BOT</h1>
  <p class="hint">Enter an http(s) URL. BOT will visit and wait for a while.</p>

  <div>
    <label for="url">Target URL</label>
    <input id="url" type="url" placeholder="https://example.com" required />
    <button id="reportButton" type="button">Report</button>
  </div>

  <script>
    const urlInput = document.getElementById('url');
    const reportButton = document.getElementById('reportButton');

    reportButton.addEventListener('click', async () => {
      const url = urlInput.value.trim();
      if (!url) {
        alert('URL is required.');
        return;
      }

      try {
        const response = await fetch('/report', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });
        const result = await response.json();
        alert(result.message);
      } catch (error) {
        alert('Report failed.');
      }
    });
  </script>
</body>

</html>
